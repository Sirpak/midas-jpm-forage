spring:
  application:
    name: midas-core

  # (Optional for this task; embedded Kafka is provided by tests)
  kafka:
    consumer:
      # JSON -> Transaction (only needed if tests don’t supply this via profile)
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.jpmc.midascore.foundation"
        spring.json.value.default.type: "com.jpmc.midascore.foundation.Transaction"

  datasource:
    url: jdbc:h2:mem:midas;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: true
      path: /h2

server:
  port: 8080

# The tests expect your listener to read this property
general:
  kafka-topic: midas.transactions
